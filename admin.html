<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Onboarding submissions — The Trademark Helpline</title>
<style>
  :root{
    --ink:#14161a; --muted:#6b7280; --line:#e4e6ea; --bg:#f7f8fa; --card:#fff;
    --brand:#c81b5b; --brand-tint:#fdeef4;
    --ok:#0f7b4f; --ok-tint:#e8f5ee; --warn:#8a5a00; --warn-tint:#fdf3e0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  h1{font-size:21px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:20px;margin-bottom:14px}
  input{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
        min-width:min(420px,100%)}
  button{font:inherit;background:var(--brand);color:#fff;border:0;border-radius:8px;
         padding:11px 22px;font-weight:600;cursor:pointer}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);
               padding:6px 12px;font-weight:400;font-size:13px}
  .sum{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:14px}
  .sum b{color:var(--ink);font-size:19px;font-weight:600;display:block}
  .s{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:12px;
     overflow:hidden}
  .s>.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
         padding:14px 16px;cursor:pointer}
  .s>.hd:hover{background:#fcfcfd}
  .t{font-weight:600}
  .m{color:var(--muted);font-size:13px;margin-top:2px}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;
       border:1px solid var(--line);color:var(--muted);margin-left:6px}
  .tag.ok{background:var(--ok-tint);color:var(--ok);border-color:transparent}
  .tag.warn{background:var(--warn-tint);color:var(--warn);border-color:transparent}
  .tag.brand{background:var(--brand-tint);color:var(--brand);border-color:transparent}
  .body{border-top:1px solid var(--line);padding:16px;display:none;background:#fcfcfd}
  .s.open .body{display:block}
  h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
     margin:16px 0 8px}
  h3:first-child{margin-top:0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{text-align:left;padding:6px 10px 6px 0;vertical-align:top}
  th{color:var(--muted);font-weight:500;font-size:12px}
  tr+tr td{border-top:1px solid var(--line)}
  code{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
  .err{background:#fdecec;color:#a11;border-radius:8px;padding:10px 12px;margin-bottom:12px}
  .none{color:var(--muted);padding:22px;text-align:center}
  details summary{cursor:pointer;color:var(--brand);font-size:13px}
  pre{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;
      overflow:auto;font-size:12px;max-height:340px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Onboarding submissions</h1>
    <span class="sub">TMH Analytics · onboarding.submissions</span>
    <span class="sub" id="build" style="margin-left:auto;opacity:.55"></span>
  </header>

  <div class="card" id="gate">
    <p style="margin-top:0">These records contain names, emails and phone numbers.
      Paste the access token to continue.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <input id="tok" type="password" placeholder="tmh_…" autocomplete="off">
      <button id="go">View</button>
    </div>
    <p class="sub" style="margin-bottom:0">Held for this browser tab only, never stored.</p>
  </div>

  <div id="out"></div>
</div>

<script>
const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
  ? '' : 'https://nwsttrpnoygthbgcadmr.supabase.co/functions/v1/onboarding';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = s => document.querySelector(s);
const date = s => s ? new Date(s).toLocaleString('en-GB',
  {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';

async function load(token){
  $('#out').innerHTML = '<div class="none">Loading…</div>';
  let d;
  try{
    const r = await fetch(API + '/api/admin/submissions', {headers:{'x-admin-token':token}});
    d = await r.json();
  }catch(e){ d = {error:'could not reach the API'}; }

  if (d.error){
    $('#out').innerHTML = `<div class="err">${d.error === 'unauthorised'
      ? 'That token was not accepted.' : esc(d.error)}</div>`;
    return;
  }

  // Only past the gate once a token actually worked.
  sessionStorage.setItem('tmh_admin_token', token);
  $('#gate').style.display = 'none';
  render(d.results || []);
}

function render(rows){
  if (!rows.length){ $('#out').innerHTML = '<div class="none">No submissions yet.</div>'; return; }

  const approved = rows.filter(r => r.authority?.decision === 'approve').length;
  const people = rows.reduce((n,r) => n + (r.derived_command?.users?.length || 0), 0);

  $('#out').innerHTML = `
    <div class="sum">
      <div><b>${rows.length}</b> submissions</div>
      <div><b>${approved}</b> auto-approved</div>
      <div><b>${rows.length - approved}</b> need review</div>
      <div><b>${people}</b> people named</div>
      <div style="margin-left:auto"><button class="ghost" id="dl">Download all as JSON</button></div>
    </div>
    ${rows.map(card).join('')}`;

  document.querySelectorAll('.s > .hd').forEach(h =>
    h.onclick = () => h.parentElement.classList.toggle('open'));

  /* Deliberately JSON rather than CSV. The CSV shaping lives in
     export_submissions.py; reimplementing it here would give two definitions of
     the same columns, free to drift apart. This is the raw record. */
  $('#dl').onclick = () => {
    const blob = new Blob([JSON.stringify(rows, null, 1)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `onboarding-submissions-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
}

function card(r){
  const d = r.derived_command || {}, i = r.input || {};
  const pf = d.portfolio || {}, w = d.watchlist || {};
  const marks = (pf.applicants || []).reduce((n,a)=>n+(a.trademarks||[]).length,0);
  const wMarks = (w.applicants || []).reduce((n,a)=>n+(a.trademarks||[]).length,0);
  const auth = r.authority;
  const decided = auth
    ? `<span class="tag ${auth.decision==='approve'?'ok':'warn'}">${auth.decision}</span>`
    : '<span class="tag">no check</span>';

  return `<div class="s">
    <div class="hd">
      <div>
        <div class="t">${esc(r.organisation_name || 'Unnamed')}${decided}
          <span class="tag brand">${esc(r.status)}</span></div>
        <div class="m">${esc(r.contact_email || 'no email')} ·
          ${marks} mark${marks===1?'':'s'} ·
          ${(pf.companies||[]).length} compan${(pf.companies||[]).length===1?'y':'ies'} ·
          ${(d.users||[]).length} user${(d.users||[]).length===1?'':'s'}${
            (w.applicants||[]).length || (w.companies||[]).length
              ? ` · watchlist ${wMarks} marks, ${(w.companies||[]).length} companies` : ''}</div>
      </div>
      <div class="m" style="text-align:right;white-space:nowrap">${date(r.created_at)}<br>
        <code>version ${r.version} · ${r.versions} saved</code></div>
    </div>
    <div class="body">
      ${auth ? `<h3>Authority</h3>
        <div class="m" style="margin-bottom:8px">${esc(auth.reason)}</div>
        <table>${(auth.evidence||[]).map(e=>`<tr>
          <td style="width:210px">${esc(e.signal)}</td>
          <td style="width:120px"><span class="tag ${
            e.outcome==='match'?'ok':e.outcome==='no_match'?'warn':''}">${esc(e.outcome)}</span></td>
          <td class="m">${esc(e.detail)}</td></tr>`).join('')}</table>` : ''}

      <h3>People</h3>
      <table>
        <tr><th>Name</th><th>Email</th><th>Mobile</th><th>Position</th><th>Can</th></tr>
        ${(d.users||[]).map(u=>`<tr>
          <td>${esc(u.first)} ${esc(u.last)}${u.primary?' <span class="tag brand">primary</span>':''}</td>
          <td>${esc(u.email)}</td><td>${esc(u.mobile)}</td><td>${esc(u.position||'')}</td>
          <td class="m">${Object.entries(u.perms||{}).filter(([,v])=>v)
              .map(([k])=>k).join(', ') || '—'}</td></tr>`).join('')}
      </table>

      <h3>Portfolio</h3>
      <table>
        ${(pf.applicants||[]).map(a=>`<tr>
          <td style="width:110px"><code>${esc(a.ipo_identifier)}</code></td>
          <td>${esc(a.name)}</td>
          <td class="m">${(a.trademarks||[]).length} mark${(a.trademarks||[]).length===1?'':'s'}${
            (a.excluded||[]).length?` · ${a.excluded.length} excluded`:''}</td>
          <td class="m">${(a.trademarks||[]).join(', ')}</td></tr>`).join('')}
        ${(pf.companies||[]).map(c=>`<tr>
          <td><code>${esc(c.company_number)}</code></td>
          <td colspan="3">${esc(c.company_name)}</td></tr>`).join('')}
      </table>

      ${(w.applicants||[]).length || (w.companies||[]).length ? `<h3>Watchlist</h3>
      <table>
        ${(w.applicants||[]).map(a=>`<tr>
          <td style="width:110px"><code>${esc(a.ipo_identifier)}</code></td>
          <td>${esc(a.name)}</td>
          <td class="m">${esc(a.relationship||'')}</td>
          <td class="m">${(a.trademarks||[]).length} marks</td></tr>`).join('')}
        ${(w.companies||[]).map(c=>`<tr>
          <td><code>${esc(c.company_number)}</code></td>
          <td>${esc(c.company_name)}</td>
          <td class="m" colspan="2">${esc(c.relationship||'')}</td></tr>`).join('')}
      </table>` : ''}

      <h3>Evidence</h3>
      <div class="m">${(r.lookup_evidence||[]).length} lookup${
        (r.lookup_evidence||[]).length===1?'':'s'} recorded at the time of the claim</div>
      <details style="margin-top:8px"><summary>Raw record</summary>
        <pre>${esc(JSON.stringify({input:i, authority:auth,
                                   lookup_evidence:r.lookup_evidence,
                                   derived_command:d}, null, 1))}</pre></details>
    </div>
  </div>`;
}

$('#go').onclick = () => load($('#tok').value.trim());
$('#tok').onkeydown = e => { if (e.key === 'Enter') load($('#tok').value.trim()); };

window.BUILD = 'build 12 Aug 03:55';
if (window.BUILD !== 'BUILD' + '_STAMP') $('#build').textContent = window.BUILD;

const saved = sessionStorage.getItem('tmh_admin_token');
if (saved) load(saved);
</script>
</body>
</html>
