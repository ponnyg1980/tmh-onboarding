<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Onboarding submissions — The Trademark Helpline</title>
<style>
  :root{
    --ink:#14161a; --muted:#6b7280; --line:#e4e6ea; --bg:#f7f8fa; --card:#fff;
    --brand:#c81b5b; --brand-tint:#fdeef4;
    --ok:#0f7b4f; --ok-tint:#e8f5ee; --warn:#8a5a00; --warn-tint:#fdf3e0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  h1{font-size:21px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:20px;margin-bottom:14px}
  input,select{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
        min-width:min(420px,100%)}
  button{font:inherit;background:var(--brand);color:#fff;border:0;border-radius:8px;
         padding:11px 22px;font-weight:600;cursor:pointer}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);
               padding:6px 12px;font-weight:400;font-size:13px}
  button:disabled{opacity:.6;cursor:wait}
  .action{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .sum{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:14px}
  .sum b{color:var(--ink);font-size:19px;font-weight:600;display:block}
  .s{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:12px;
     overflow:hidden}
  .s>.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
         padding:14px 16px;cursor:pointer}
  .s>.hd:hover{background:#fcfcfd}
  .t{font-weight:600}
  .m{color:var(--muted);font-size:13px;margin-top:2px}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;
       border:1px solid var(--line);color:var(--muted);margin-left:6px}
  .tag.ok{background:var(--ok-tint);color:var(--ok);border-color:transparent}
  .tag.warn{background:var(--warn-tint);color:var(--warn);border-color:transparent}
  .tag.brand{background:var(--brand-tint);color:var(--brand);border-color:transparent}
  .body{border-top:1px solid var(--line);padding:16px;display:none;background:#fcfcfd}
  .s.open .body{display:block}
  h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
     margin:16px 0 8px}
  h3:first-child{margin-top:0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{text-align:left;padding:6px 10px 6px 0;vertical-align:top}
  th{color:var(--muted);font-weight:500;font-size:12px}
  tr+tr td{border-top:1px solid var(--line)}
  code{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
  .err{background:#fdecec;color:#a11;border-radius:8px;padding:10px 12px;margin-bottom:12px}
  .none{color:var(--muted);padding:22px;text-align:center}
  details summary{cursor:pointer;color:var(--brand);font-size:13px}
  pre{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;
      overflow:auto;font-size:12px;max-height:340px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Onboarding submissions</h1>
    <span class="sub">Temmy Portal · onboarding intake</span>
    <span class="sub" id="build" style="margin-left:auto;opacity:.55"></span>
  </header>

  <div class="card" id="gate">
    <p style="margin-top:0">These records contain names, emails and phone numbers.
      Paste the access token to continue.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <input id="tok" type="password" placeholder="tmh_…" autocomplete="off">
      <button id="go">View</button>
    </div>
    <p class="sub" style="margin-bottom:0">Held for this browser tab only, never stored.</p>
  </div>

  <div id="out"></div>
</div>

<script>
const PORTAL_API = globalThis.TMH_PORTAL_API_BASE ||
  'https://tmh-portal-git-dev-alexs-projects-5ddeff74.vercel.app/api/onboarding-intake';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rec = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
const recs = v => Array.isArray(v) ? v.filter(x => Object.keys(rec(x)).length) : [];
const vals = v => Array.isArray(v) ? v : [];
const peopleFor = r => recs(rec(r.derived_command)[
  r.form_type === 'existing_client_compliance' ? 'people' : 'users']);
const $ = s => document.querySelector(s);
const date = s => s ? new Date(s).toLocaleString('en-GB',
  {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';

async function load(token){
  $('#out').innerHTML = '<div class="none">Loading…</div>';
  let d;
  try{
    const r = await fetch(PORTAL_API + '/admin/submissions?limit=250',
      {headers:{'x-admin-token':token}});
    d = await r.json();
  }catch(e){ d = {error:'could not reach the API'}; }

  if (d.error){
    $('#out').innerHTML = `<div class="err">${d.error === 'unauthorised'
      ? 'That token was not accepted.' : esc(d.error)}</div>`;
    return;
  }

  // Only past the gate once a token actually worked.
  sessionStorage.setItem('tmh_admin_token', token);
  $('#gate').style.display = 'none';
  render(d.results || []);
}

function render(rows){
  rows = recs(rows);
  if (!rows.length){ $('#out').innerHTML = '<div class="none">No submissions yet.</div>'; return; }

  const approved = rows.filter(r => rec(r.authority).decision === 'approve').length;
  const people = rows.reduce((n,r) => n + peopleFor(r).length, 0);

  $('#out').innerHTML = `
    <div class="sum">
      <div><b>${rows.length}</b> submissions</div>
      <div><b>${approved}</b> auto-approved</div>
      <div><b>${rows.length - approved}</b> need review</div>
      <div><b>${people}</b> people named</div>
      <div style="margin-left:auto"><button class="ghost" id="dl">Download all as JSON</button></div>
    </div>
    ${rows.map(card).join('')}`;

  document.querySelectorAll('.s > .hd').forEach(h =>
    h.onclick = () => h.parentElement.classList.toggle('open'));
  document.querySelectorAll('[data-loa]').forEach(b =>
    b.onclick = () => downloadLoa(b));
  document.querySelectorAll('[data-approve-plan]').forEach(b =>
    b.onclick = () => approvePlan(b));
  document.querySelectorAll('[data-apply-plan]').forEach(b =>
    b.onclick = () => applyPlan(b));

  /* Deliberately JSON rather than CSV. The CSV shaping lives in
     export_submissions.py; reimplementing it here would give two definitions of
     the same columns, free to drift apart. This is the raw record. */
  $('#dl').onclick = () => {
    const blob = new Blob([JSON.stringify(rows, null, 1)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `onboarding-submissions-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
}

function card(r){
  r = rec(r);
  const d = rec(r.derived_command), i = rec(r.input);
  const compliance = r.form_type === 'existing_client_compliance';
  const pf = rec(d.portfolio), w = rec(d.watchlist);
  const applicants = compliance ? recs(d.records).map(a => ({...a,
    trademarks: recs(d.trademarks).filter(t => recs(t.applicants).some(owner =>
      owner.ipo_identifier === a.ipo_identifier)).map(t => t.application_number),
  })) : recs(pf.applicants);
  const companies = recs(pf.companies);
  const watchApplicants = recs(w.applicants), watchCompanies = recs(w.companies);
  const users = peopleFor(r), auth = Object.keys(rec(r.authority)).length ? rec(r.authority) : null;
  const reconciliation = rec(r.reconciliation);
  const reconciliationResult = rec(reconciliation.result);
  const decisions = recs(reconciliationResult.decisions);
  const applicationPlan = rec(r.application_plan);
  const applicationExecution = rec(r.application_execution);
  const reviewHeld = decisions.some(item => item.decision === 'review_required' ||
    (item.decision === 'proposed_unassignment' && !item.relationshipProvenance));
  const marks = compliance ? recs(d.trademarks).length :
    applicants.reduce((n,a)=>n+vals(a.trademarks).length,0);
  const wMarks = watchApplicants.reduce((n,a)=>n+vals(a.trademarks).length,0);
  const decided = auth
    ? `<span class="tag ${auth.decision==='approve'?'ok':'warn'}">${esc(auth.decision)}</span>`
    : '<span class="tag">no check</span>';
  const loa = r.form_type === 'existing_client_compliance' && r.completed === true
    ? `<div class="action"><button class="ghost" data-loa
         data-submission="${esc(r.submission_id)}" data-version="${esc(r.version)}">
         Generate draft LOA</button><span class="m" data-loa-status></span></div>` : '';
  const approval = decisions.length ? `<div class="action">
    ${Object.keys(applicationPlan).length
      ? `<span class="tag ok">Application plan approved</span>
         <span class="m">${esc(applicationPlan.primaryInvitee?.membershipRole || '')} ·
           ${date(applicationPlan.approvedAt)}</span>
         <button class="ghost" data-apply-plan
           data-submission="${esc(r.submission_id)}" data-version="${esc(r.version)}">
           Apply to Zoho</button>
         <span class="m" data-apply-status>${Object.keys(applicationExecution).length
           ? `CRM status: ${esc(applicationExecution.status)}${applicationExecution.error
             ? ` · ${esc(applicationExecution.error)}` : ''}` : ''}</span>`
      : `<select data-plan-role aria-label="Portal membership role">
          <option value="">Select Portal role…</option>
          ${['owner','admin','billing','viewer','advisor'].map(role =>
            `<option value="${role}">${role}</option>`).join('')}
         </select>
         <button class="ghost" data-approve-plan
           data-submission="${esc(r.submission_id)}" data-version="${esc(r.version)}"
           ${reviewHeld ? 'disabled' : ''}>Approve application plan</button>
         <span class="m" data-plan-status>${reviewHeld
           ? 'Held: resolve every review-required decision first.' : ''}</span>`}
    </div>` : '';

  return `<div class="s">
    <div class="hd">
      <div>
        <div class="t">${esc(r.organisation_name || 'Unnamed')}${decided}
          <span class="tag brand">${esc(r.status)}</span></div>
        <div class="m">${esc(r.contact_email || 'no email')} ·
          ${marks} mark${marks===1?'':'s'} ·
          ${compliance ? `${applicants.length} applicant records` :
            `${companies.length} compan${companies.length===1?'y':'ies'}`} ·
          ${compliance ? `${users.length} ${users.length===1?'person':'people'} named` :
            `${users.length} user${users.length===1?'':'s'}`}${
            watchApplicants.length || watchCompanies.length
              ? ` · watchlist ${wMarks} marks, ${watchCompanies.length} companies` : ''}</div>
      </div>
      <div class="m" style="text-align:right;white-space:nowrap">${date(r.created_at)}<br>
        <code>ID ${esc(r.submission_id)}<br>${esc(r.form_type)} ·
          version ${esc(r.version)} · ${esc(r.versions)} saved</code></div>
    </div>
    <div class="body">
      ${approval}
      ${loa}
      ${decisions.length ? `<h3>Reconciliation</h3>
        <div class="m">Snapshot <code>${esc(reconciliation.snapshot_id)}</code> ·
          snapshot fingerprint <code>${esc(reconciliation.snapshot_fingerprint)}</code><br>
          reconciliation fingerprint <code>${esc(reconciliation.fingerprint)}</code></div>
        <table>${decisions.map(item=>`<tr>
          <td><span class="tag ${item.decision === 'review_required' ? 'warn' :
            item.decision === 'matched_unchanged' ? 'ok' : ''}">${esc(item.decision)}</span></td>
          <td>${esc(item.submissionContactKey || item.snapshotContactId || '')}</td>
          <td class="m">${esc(item.reason || vals(item.changes).join(', ') ||
            item.relationshipProvenance || '')}</td></tr>`).join('')}</table>` : ''}
      ${auth ? `<h3>Authority</h3>
        <div class="m" style="margin-bottom:8px">${esc(auth.reason)}</div>
        <table>${recs(auth.evidence).map(e=>`<tr>
          <td style="width:210px">${esc(e.signal)}</td>
          <td style="width:120px"><span class="tag ${
            e.outcome==='match'?'ok':e.outcome==='no_match'?'warn':''}">${esc(e.outcome)}</span></td>
          <td class="m">${esc(e.detail)}</td></tr>`).join('')}</table>` : ''}

      <h3>People</h3>
      ${compliance ? `<p class="m">Captured claims only. Portal selection does not prove
        an invitation or settled authority. Report routing is separate from permission
        to instruct work.</p>` : ''}
      <table>
        <tr><th>Name</th><th>Email</th><th>Mobile</th><th>Position</th>
          <th>${compliance ? 'Captured permissions' : 'Can'}</th>
          ${compliance ? '<th>Captured access / reports</th>' : ''}</tr>
        ${users.map(u=>`<tr>
          <td>${esc(u.first)} ${esc(u.last)}${u.primary?' <span class="tag brand">primary</span>':''}</td>
          <td>${esc(u.email)}</td><td>${esc(compliance ? u.phone : u.mobile)}</td>
          <td>${esc(compliance ? u.job : u.position)}</td>
          <td class="m">${Object.entries(rec(u.perms)).filter(([,v])=>v)
              .map(([k])=>esc(k)).join(', ') || '—'}</td>
          ${compliance ? `<td class="m">Portal selection: ${esc(u.portal || 'Not provided')}<br>
            Reports: ${u.reports === true ? 'Yes' : u.reports === false ? 'No' : 'Not provided'}<br>
            Claimed role: ${esc(u.role || 'Not provided')}</td>` : ''}</tr>`).join('')}
      </table>

      <h3>Portfolio</h3>
      <table>
        ${applicants.map(a=>`<tr>
          <td style="width:110px"><code>${esc(a.ipo_identifier)}</code></td>
          <td>${esc(a.name)}</td>
          <td class="m">${vals(a.trademarks).length} mark${vals(a.trademarks).length===1?'':'s'}${
            vals(a.excluded).length?` · ${vals(a.excluded).length} excluded`:''}</td>
          <td class="m">${vals(a.trademarks).map(esc).join(', ')}</td></tr>`).join('')}
        ${companies.map(c=>`<tr>
          <td><code>${esc(c.company_number)}</code></td>
          <td colspan="3">${esc(c.company_name)}</td></tr>`).join('')}
      </table>

      ${watchApplicants.length || watchCompanies.length ? `<h3>Watchlist</h3>
      <table>
        ${watchApplicants.map(a=>`<tr>
          <td style="width:110px"><code>${esc(a.ipo_identifier)}</code></td>
          <td>${esc(a.name)}</td>
          <td class="m">${esc(a.relationship||'')}</td>
          <td class="m">${vals(a.trademarks).length} marks</td></tr>`).join('')}
        ${watchCompanies.map(c=>`<tr>
          <td><code>${esc(c.company_number)}</code></td>
          <td>${esc(c.company_name)}</td>
          <td class="m" colspan="2">${esc(c.relationship||'')}</td></tr>`).join('')}
      </table>` : ''}

      <h3>Evidence</h3>
      <div class="m">${vals(r.lookup_evidence).length} lookup${
        vals(r.lookup_evidence).length===1?'':'s'} recorded at the time of the claim</div>
      <details style="margin-top:8px"><summary>Raw record</summary>
        <pre>${esc(JSON.stringify({input:i, authority:auth, reconciliation,
                                   application_plan:applicationPlan,
                                   lookup_evidence:r.lookup_evidence,
                                   derived_command:d}, null, 1))}</pre></details>
    </div>
  </div>`;
}

async function approvePlan(button){
  const status = button.parentElement.querySelector('[data-plan-status]');
  const membershipRole = button.parentElement.querySelector('[data-plan-role]').value;
  const staffActorRef = prompt('Staff actor reference (for immutable approval evidence):',
    sessionStorage.getItem('tmh_staff_actor_ref') || 'staff:');
  if (!membershipRole || !staffActorRef) {
    status.textContent = 'Select a role and enter a staff actor reference.';
    return;
  }
  button.disabled = true;
  status.textContent = 'Recording immutable plan…';
  try{
    const token = sessionStorage.getItem('tmh_admin_token') || '';
    const path = `/admin/submissions/${encodeURIComponent(button.dataset.submission)}` +
      `/versions/${encodeURIComponent(button.dataset.version)}/application-plan`;
    const response = await fetch(PORTAL_API + path, {method:'POST', headers:{
      'content-type':'application/json', 'x-admin-token':token,
    }, body:JSON.stringify({membership_role:membershipRole,
      staff_actor_ref:staffActorRef.trim()})});
    const data = await response.json();
    if (!response.ok || data.error) throw new Error(data.error || 'Approval failed.');
    sessionStorage.setItem('tmh_staff_actor_ref', staffActorRef.trim());
    await load(token);
  }catch(error){
    status.textContent = error.message || 'Approval failed.';
    button.disabled = false;
  }
}

async function applyPlan(button){
  const status = button.parentElement.querySelector('[data-apply-status]');
  button.disabled = true;
  status.textContent = 'Applying immutable plan…';
  try{
    const token = sessionStorage.getItem('tmh_admin_token') || '';
    const path = `/admin/submissions/${encodeURIComponent(button.dataset.submission)}` +
      `/versions/${encodeURIComponent(button.dataset.version)}/application-plan/apply-zoho`;
    const response = await fetch(PORTAL_API + path, {method:'POST',
      headers:{'x-admin-token':token}});
    const data = await response.json();
    if (!data.status) throw new Error(data.error || 'Application failed.');
    status.textContent = `CRM status: ${data.status}${data.replayed ? ' (replayed)' : ''}` +
      `${data.error ? ` · ${data.error}` : ''}`;
  }catch(error){ status.textContent = error.message || 'Application failed.'; }
  finally{ button.disabled = false; }
}

async function downloadLoa(button){
  const status = button.parentElement.querySelector('[data-loa-status]');
  button.disabled = true;
  status.textContent = 'Generating…';
  try{
    const token = sessionStorage.getItem('tmh_admin_token') || '';
    const path = `/admin/submissions/${encodeURIComponent(button.dataset.submission)}` +
      `/versions/${encodeURIComponent(button.dataset.version)}/loa`;
    const response = await fetch(PORTAL_API + path,
      {headers:{'x-admin-token':token}});
    const blob = await response.blob();
    if (!response.ok || blob.type !== 'application/pdf' || !blob.size)
      throw new Error(response.status === 401 ? 'Session expired.' : 'Draft LOA unavailable.');
    const disposition = response.headers.get('content-disposition') || '';
    const filename = disposition.match(/filename="([^"]+)"/)?.[1] || 'Draft LOA.pdf';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
    status.textContent = 'Downloaded.';
  }catch(error){ status.textContent = error.message || 'Draft LOA unavailable.'; }
  finally{ button.disabled = false; }
}

$('#go').onclick = () => load($('#tok').value.trim());
$('#tok').onkeydown = e => { if (e.key === 'Enter') load($('#tok').value.trim()); };

window.BUILD = 'build TMH-128';
if (window.BUILD !== 'BUILD' + '_STAMP') $('#build').textContent = window.BUILD;

const saved = sessionStorage.getItem('tmh_admin_token');
if (saved) load(saved);
</script>
</body>
</html>
